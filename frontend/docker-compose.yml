services:
  saas-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: saas-frontend:latest
    container_name: saas-frontend-app
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - saas-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  saas-network:
    name: saas-network
    driver: bridge
