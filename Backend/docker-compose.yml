services:
  saas-postgres:
    image: postgres:16-alpine
    container_name: saas-postgres-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-saas_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-supersecretpassword}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - saas_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - saas-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  saas-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: saas-backend-api:latest
    container_name: saas-backend-api
    restart: unless-stopped
    depends_on:
      saas-postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Host=saas-postgres;Port=5432;Database=${POSTGRES_DB:-saas_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-supersecretpassword}
      - Jwt__Key=${JWT_KEY:-your-production-jwt-key-that-is-at-least-32-chars-long!!!}
      - Stripe__SecretKey=${STRIPE_SECRET_KEY:-sk_test_placeholder}
      - Stripe__WebhookSecret=${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
    networks:
      - saas-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  saas_postgres_data:
    driver: local

networks:
  saas-network:
    name: saas-network
    driver: bridge
